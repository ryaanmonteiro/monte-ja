{% extends "base.html" %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<div class="caixa">
  <h1>➜] Faça login</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <p><a href="{% url 'password_reset' %}">Esqueceu a senha?</a></p>
    <button class="btn" type="submit">Avançar</button>
  </form>
  <p style="text-align:right"><a class="btn-sec btn" href="{% url 'contas:cadastro' %}">Criar conta</a></p>
</div>
{% endblock %}
