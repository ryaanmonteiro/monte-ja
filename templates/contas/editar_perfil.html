{% extends "base.html" %}
{% block titulo %}Meu perfil{% endblock %}
{% block conteudo %}
<div class="caixa larga"><h1>Meu perfil</h1>
<p>E-mail: {{ user.email }} · Tipo: {{ user.get_tipo_display }}{% if user.eh_montador %} · <a href="{% url 'contas:perfil_montador' user.pk %}">Ver meu perfil público</a>{% endif %}</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn" type="submit">Salvar</button></form></div>
{% endblock %}
