{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="caixa">
  <h1>Crie uma Conta</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn" type="submit">Avançar</button></form>
  <p>Já tem conta? <a href="{% url 'contas:login' %}">Faça login</a></p>
</div>
{% endblock %}
