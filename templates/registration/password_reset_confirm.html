{% extends "base.html" %}
{% block conteudo %}<div class="caixa"><h1>Nova senha</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn" type="submit">Salvar nova senha</button></form>
{% else %}<p>Link inválido ou expirado. <a href="{% url 'password_reset' %}">Solicite outro</a>.</p>{% endif %}</div>{% endblock %}
